name: Workflow Lint

on:
  pull_request:
    branches: [main, next]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run actionlint
        run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
