  # ---------------------------------------------------------------------------
  # Windows Vulkan build — AMD & Intel (single binary covers both)
  # ---------------------------------------------------------------------------
  build-windows-vulkan:
    name: Windows Vulkan
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.3.290.0
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" -OutFile $installer
          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The LunarG SDK ships SPIRV-Headers but not its CMake package config, which
      # `find_package(SPIRV-Headers CONFIG REQUIRED)` in ggml-vulkan needs. Install
      # it from source (header-only) and expose it via CMAKE_PREFIX_PATH.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "$env:RUNNER_TEMP\SPIRV-Headers"
          $prefix = "$env:RUNNER_TEMP\spirv-headers"
          git clone --depth 1 --branch vulkan-sdk-1.4.313.0 https://github.com/KhronosGroup/SPIRV-Headers.git $src
          cmake -S $src -B "$src\build" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$src\build" --target install --config Release
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install LLVM (bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      # Build the Vulkan backend with Ninja, not the Visual Studio generator:
      # vulkan-shaders-gen is a nested ExternalProject whose install step breaks
      # on the multi-config VS generator. Ninja needs the MSVC env.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-vulkan
          cache-targets: false

      - name: Build
        shell: pwsh
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/bin
          CMAKE_GENERATOR: Ninja
          # Force MSVC for the C/C++ build so the nested vulkan-shaders-gen
          # ExternalProject doesn't auto-pick the bindgen Clang (too old for the
          # VS18 STL). libclang is still used by bindgen via LIBCLANG_PATH.
          CC: cl
          CXX: cl
        run: cargo build --release --features cli,http,vulkan,vision

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/spindll.exe dist/
          cd dist
          7z a "spindll-windows-vulkan.zip" spindll.exe
          rm spindll.exe

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/spindll-windows-vulkan.zip --clobber

