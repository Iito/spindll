name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip superseded RC tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if echo "$TAG_NAME" | grep -qE '\-rc\.[0-9]+$'; then
            RC_NUM=$(echo "$TAG_NAME" | grep -oE '[0-9]+$')
            PREFIX=$(echo "$TAG_NAME" | sed 's/-rc\.[0-9]*$//')
            LATEST=$(git tag -l "${PREFIX}-rc.*" | grep -oE '[0-9]+$' | sort -n | tail -1)
            if [ "$RC_NUM" -lt "$LATEST" ]; then
              echo "::notice::Skipping $TAG_NAME — newer RC ${PREFIX}-rc.${LATEST} exists"
              exit 1
            fi
          fi

      - name: Verify Cargo.toml version matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=$(echo "$TAG_NAME" | sed 's/^v//; s/-rc\.[0-9]*$//')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: v$CARGO_VERSION"

  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --features cli,http

  # ---------------------------------------------------------------------------
  # Create the GitHub release as soon as tests pass — build jobs then attach
  # their artifacts to it as each platform finishes. Notes are never
  # auto-generated (--generate-notes only dumps squash-merged PR titles): the
  # body is carried over from the newest RC pre-release of the same version,
  # and that RC release is retired in the same step (its git tag is kept).
  # The first RC of a cycle starts with a placeholder to curate by hand.
  # ---------------------------------------------------------------------------
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Detect release type
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if echo "$TAG_NAME" | grep -qE '\-rc\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "version_prefix=$(echo "$TAG_NAME" | sed 's/-rc\.[0-9]*$//')" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "version_prefix=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release, carrying notes from superseded RCs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION_PREFIX: ${{ steps.meta.outputs.version_prefix }}
        run: |
          if gh release view "$TAG_NAME" --json tagName >/dev/null 2>&1; then
            echo "::notice::Release $TAG_NAME already exists — leaving it untouched"
            exit 0
          fi

          NOTES_FILE=$(mktemp)
          echo "_Release notes pending._" > "$NOTES_FILE"

          # Newest RC pre-release of this version donates its curated body.
          RC_TAGS=$(gh release list --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"${VERSION_PREFIX}-rc.\"))) | .tagName" \
            | grep -v -x "$TAG_NAME" || true)
          if [ -n "$RC_TAGS" ]; then
            LATEST_RC="${VERSION_PREFIX}-rc.$(echo "$RC_TAGS" | grep -oE '[0-9]+$' | sort -n | tail -1)"
            echo "Carrying release notes from $LATEST_RC"
            gh release view "$LATEST_RC" --json body --jq '.body' > "$NOTES_FILE"
          fi

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file "$NOTES_FILE"
          fi

          # Only after the new release exists: retire the RC releases it
          # supersedes. Git tags are kept for provenance.
          for OLD_TAG in $RC_TAGS; do
            echo "Deleting superseded RC release: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes
          done

