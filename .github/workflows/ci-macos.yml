# CI coverage for the Apple-Silicon MLX path.
#
# The MLX Swift bridge + colocated Metal shaders only build on aarch64 macOS
# (build.rs gates on target_os="macos", target_arch="aarch64", feature="mlx"),
# so the ubuntu/windows matrix in ci.yml never exercises them. This job builds
# `--features cli,http,mlx,vision` and runs the lib tests on macos-26 (arm64) —
# the same surface scripts/mlx-validate.sh checks by hand, gated in CI so a
# Swift 6 / MLX compile break can't slip through unnoticed.
#
# Xcode 26.6 is selected explicitly: mlx-swift 0.31.5+ declares swift-tools
# 6.3, which needs Swift 6.3+ (Xcode 26.4+); the macos-15 image tops out at
# Xcode 26.3 (Swift 6.2). Xcode 26 ships the Metal compiler as a separate
# downloadable component — the guard step fetches it when absent so
# build.rs's metallib compilation works.
#
# Path-scoped to MLX-relevant changes (incl. mlx_bridge/**, which ci.yml omits)
# so a Swift-bridge-only change runs ONLY this job, not the Linux/Windows matrix.
name: CI (macOS)

on:
  pull_request:
    branches: [main, next]
    paths:
      - "src/**"
      - "proto/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mlx_bridge/**"
      - ".github/workflows/ci-macos.yml"
  workflow_dispatch:

# macOS runner minutes bill ~10x Linux — cancel superseded runs on the same ref.
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mlx-build:
    name: build + test (mlx,vision)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.6 (Swift 6.3.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Ensure Metal Toolchain component
        run: xcrun -sdk macosx -f metal >/dev/null 2>&1 || sudo xcodebuild -downloadComponent MetalToolchain

      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install cmake protobuf

      - name: Locate libclang (Xcode toolchain, for bindgen / vision)
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-mlx

      - name: Build (mlx + vision)
        run: cargo build --features cli,http,mlx,vision

      - name: Test (lib)
        run: cargo test --features cli,http,mlx,vision --lib
