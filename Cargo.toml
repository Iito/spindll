[package]
name = "spindll"
version = "0.8.0"
edition = "2024"
description = "A Rust-native GGUF and MLX inference engine with model management"
license = "Apache-2.0"
repository = "https://github.com/Iito/spindll"
keywords = ["llm", "inference", "gguf", "llama", "gpu"]
categories = ["science", "api-bindings"]

[[bin]]
name = "spindll"
path = "src/main.rs"
required-features = ["cli"]


[features]
# cli adds the standalone binary extras (argument parsing, pretty logging).
# The gRPC server is part of the default library — embedders need it.
cli = [
    "dep:clap",
    "dep:tracing-subscriber",
]
# http adds an HTTP/SSE API alongside the gRPC server.
http = [
    "dep:axum",
    "dep:tower-http",
]
# GPU backends — forward to llama-cpp-2 so it compiles llama.cpp with the right support.
cuda   = ["llama-cpp-2/cuda"]
metal  = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
# MLX Swift bridge — Apple Silicon only, compiles mlx_bridge Swift package.
# Usage: cargo build --features mlx   (aarch64-apple-darwin only)
mlx    = []
# In-process benchmark command (spindll bench).
# Usage: cargo build --features cli,bench
bench  = ["cli"]
# Vision / multimodal support via llama.cpp's mtmd (multimodal) API.
vision = ["llama-cpp-2/mtmd", "dep:base64"]
# Cross-machine layer offload via llama.cpp's RPC backend. The C backend is
# compiled in all builds (GGML_RPC=ON via .cargo/config.toml [env] forwarding);
# this feature gates spindll's Rust surface for it. Requires the [patch.crates-io]
# git pin — the crates.io tarball strips the ggml-rpc sources.
rpc = []
# Grammar-constrained decoding (GBNF via llama.cpp's json-schema-to-grammar and
# lazy grammar sampler). Opt-in: pulls in llama-cpp-2's `common` library, which
# compiles llama.cpp's common/ C++ sources (adds build time). Forces a valid
# tool call when `tool_choice` is `required` or names a function.
grammar = ["llama-cpp-2/common"]

[dependencies]
# Core — always compiled
tokio        = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic        = "0.13"
prost        = "0.13"
llama-cpp-2      = "0.1"
llama-cpp-sys-2  = "0.1"
encoding_rs  = "0.8"
sha2         = "0.10"
chacha20poly1305 = "0.10"
zstd             = "0.13"
hf-hub       = "0.4"
reqwest      = { version = "0.12", features = ["blocking"] }
indicatif    = "0.17"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
anyhow       = "1"
tracing      = "0.1"
sysinfo      = "0.35"
memory-stats = "1"
libc         = "0.2"
urlencoding  = "2"
# Chat templating — render the model's embedded Hugging Face Jinja template
# faithfully. minijinja is the engine llama-cpp-2's own docs recommend for
# templates its legacy formatter can't handle; the pycompat contrib supplies the
# Python string methods (`.strip()`, `.startswith()`, …) HF templates call.
minijinja         = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }

# vision (optional)
base64 = { version = "0.22", optional = true }

# http server (optional)
axum       = { version = "0.8", features = ["macros"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# cli binary only
clap               = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.13"

# Pin the llama-cpp crates to the upstream git repo at the exact 0.1.154 release
# rev. Same code as crates.io, except the git tree carries llama.cpp as a full
# submodule *including* ggml/src/ggml-rpc/, which the published tarball strips —
# required for the `rpc` feature's GGML_RPC=ON build (see .cargo/config.toml).
# Drop this patch if upstream ever ships an `rpc` build feature.
[patch.crates-io]
llama-cpp-2     = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "bed81ad4ab1a6c904b11d425608e50f976d8ea62" }
llama-cpp-sys-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "bed81ad4ab1a6c904b11d425608e50f976d8ea62" }
